# Prefect deployment for the hourly send pipeline.
#
# Deploy (after `prefect cloud login`):
#   uv run prefect deploy --all
#
# The worker that executes runs is started with:
#   uv run prefect worker start --pool wishly-pool
name: wishly
prefect-version: 3.0.0

# The flow code ships inside the image, so no pull step is needed at runtime.
pull: null

deployments:
  - name: hourly-send
    entrypoint: src/wishly/orchestration/flows.py:send_reminders
    description: >-
      Finds reminders due this hour and sends each exactly once. Per-user
      send_hour gating happens inside the flow, so the tick is a plain hourly cron.
    work_pool:
      name: wishly-pool
    schedules:
      - cron: "0 * * * *"
        timezone: "UTC"
        active: true

  # Manually triggered — no `schedules`, so it only ever runs when you start it
  # from the Prefect UI or CLI. Exercises the same DB -> render -> Resend path as
  # hourly-send, but for an event that is not due yet, which is the whole point:
  # the next real send may be months away.
  #
  # `send: false` is the default on purpose. Triggering with stock parameters
  # renders the email and publishes it as a run artifact without touching Resend;
  # set send=true in the UI when you want it delivered.
  - name: preview-reminder
    entrypoint: src/wishly/orchestration/preview.py:preview_reminder
    description: >-
      On-demand preview of a reminder email. Renders from real database rows and
      optionally sends via Resend, recording the result in test_email_log (never
      notification_log, which would suppress the genuine reminder).
    work_pool:
      name: wishly-pool
    parameters:
      days_before: 7
      send: false
