# Local development and tests ONLY. Production uses PlanetScale.
#
#   docker compose up -d
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wishly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Scripts here run once, the first time the data volume is created.
      - ./dev/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
