[project]
name = "wishly"
version = "0.1.0"
description = "Wishly backend — birthday/anniversary reminder emails (FastAPI + Prefect over Postgres)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "clerk-backend-api>=6.0.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pendulum>=3.1.0",
    "premailer>=3.10.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.13.0",
    "resend>=2.30.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "svix>=1.95.2",
    "uvicorn[standard]>=0.49.0",
    "boto3>=1.43.89",
    "certifi>=2026.5.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wishly"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["wishly"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Third-party libraries that ship without type stubs (py.typed). Keeps strict
# mode usable without scattering per-import ignores through the source.
[[tool.mypy.overrides]]
module = [
    "premailer",
    "premailer.*",
    "resend",
    "resend.*",
    "svix",
    "svix.*",
    "clerk_backend_api",
    "clerk_backend_api.*",
    "prefect",
    "prefect.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
# Prefect is the send pipeline's, not the API's. It is 106 MB installed and
# nothing under api/, db/, email/ or core/ imports it — only orchestration/ does.
# Splitting it out takes that weight out of the API image, which matters because
# a scale-to-zero Fargate service re-pulls the image on every cold start, so
# image size is recovery time.
#
#   API image     uv sync --no-dev
#   worker image  uv sync --no-dev --group worker
#
# dev includes it: the test suite imports wishly.orchestration.preview.
worker = [
    "prefect>=3.0.0",
]
dev = [
    { include-group = "worker" },
    "boto3-stubs>=1.43.89",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
