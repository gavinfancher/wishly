# Wishly application stack.
#
#   docker compose -f infra/compose.yaml --env-file infra/.env up -d
#
# Three long-lived containers and one one-shot. The database is NOT here: it is
# PlanetScale Postgres, reached over the public internet via DATABASE_URL. For a
# self-contained stack with a local Postgres, add the overlay:
#
#   docker compose -f infra/compose.yaml -f infra/compose.local.yaml \
#     --env-file infra/.env up -d
#
# Build context is the repo root (..) so the images can copy backend/.
# No application port is published — inbound traffic arrives via cloudflared.
services:
  # One-shot: apply infra/sql/schema.sql, then exit. `create table if not exists`
  # throughout, so running it on every boot is a no-op once the tables exist.
  #
  # It waits for the database itself rather than using `depends_on: healthy`,
  # which cannot span hosts: with the database on PlanetScale there is no local
  # container to depend on, and a compose restart while the database is still
  # reachable-but-slow would otherwise start the API against an empty schema.

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: wishly-api:latest
    env_file:
      - .env
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app_net

  # The send pipeline. `python -m wishly.orchestration.flows` calls Prefect's
  # serve(), which registers both deployments with their schedules and then runs
  # their flow runs in subprocesses of this container. One process does the whole
  # job — there is no work pool, no separate worker, and no prefect.yaml.
  #
  # Scheduling lives in Prefect Cloud (PREFECT_API_URL + PREFECT_API_KEY), so the
  # control plane survives this host going away. That matters: the standby exists
  # precisely for the case where this machine is gone, and a scheduler running
  # here would be gone with it.
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    image: wishly-worker:latest
    env_file:
      - .env
    depends_on:
      schema:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app_net

  cloudflared:
    image: cloudflare/cloudflared:2025.4.0
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
