# Production stack on the VM: the API image from GHCR + a Cloudflare Tunnel.
# The database is PlanetScale, not a container here.
#
# Ansible copies this file to /opt/wishly on the VM. Every value below comes from
# Infisical, so start it with deploy.sh, which runs:
#
#   infisical run --env=prod -- docker compose up -d
services:
  api:
    image: ${WISHLY_IMAGE:?missing - start this with deploy.sh so Infisical provides it}
    # Names only, no values: compose copies each one from the environment
    # `infisical run` started it with. Nothing secret is written to disk.
    environment:
      - WISHLY_DATABASE_URL
      - WISHLY_CORS_ORIGINS
      - WISHLY_RUN_TOKEN
      - WISHLY_RESEND_API_KEY
      - WISHLY_SIGNUP_ENABLED # optional; set to false once your account exists
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Shares the API's network namespace (as containers in one ECS task do), so the
  # tunnel's route is http://localhost:8000 here and on ECS alike. No ports are
  # published: all inbound traffic arrives through the tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
