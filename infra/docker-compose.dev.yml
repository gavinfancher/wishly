# Local development database only. The full stack lives in docker-compose.yml (later).
# Usage: docker compose -f infra/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: wishly-postgres-dev
    environment:
      POSTGRES_USER: wishly
      POSTGRES_PASSWORD: wishly
      POSTGRES_DB: wishly
    ports:
      - "5432:5432"
    volumes:
      - wishly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishly -d wishly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  wishly_pgdata:
    name: wishly_pgdata
