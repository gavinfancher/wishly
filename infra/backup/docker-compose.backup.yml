# Optional backup sidecar (PLAN T8.3). Overlay on the main stack:
#
#   docker compose -f infra/docker-compose.yml -f infra/backup/docker-compose.backup.yml \
#       --env-file infra/.env up -d backup
#
# Runs a simple daily loop inside a postgres:16 image (so pg_dump matches the
# server version) and writes to the named volume `wishly_backups`. For host-cron
# instead of an always-on container, see docs/runbooks/backup-restore.md.
services:
  backup:
    image: postgres:16
    container_name: wishly-backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./backup:/scripts:ro
      - wishly_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do /scripts/backup.sh || echo "backup failed"; sleep "${BACKUP_INTERVAL_SECONDS}"; done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

volumes:
  wishly_backups:
    name: wishly_backups

networks:
  app_net:
    external: true
    name: infra_app_net
