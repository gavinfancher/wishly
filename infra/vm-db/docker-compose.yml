# vm-db — Wishly's footprint on the shared database host (DEPLOYMENT-PLAN T1).
#
#   docker compose -f infra/vm-db/docker-compose.yml up -d
#
# **This does not run Postgres.** The server already exists on this VM as
# `homecloud-postgres` (compose project `ubuntu`, /home/ubuntu/docker-compose.yml)
# and is shared infrastructure — a stand-in for the managed database this will
# eventually be. Wishly is a *tenant* in it: see sql/create_tenant.sql, which is
# run once by hand to create the `wishly` and `prefect` databases and roles.
#
# All this file contributes is the backup job, which lives here so pg_dump runs
# against a local socket rather than pulling the database across the VPN hourly.
services:
  backup:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.backup
    image: wishly-backup:latest
    container_name: wishly-backup
    environment:
      # host-gateway reaches the published 5432 of the *other* compose project.
      # Joining its network instead would couple Wishly's lifecycle to a stack
      # it does not own.
      DATABASE_URL: postgresql://wishly:${WISHLY_DB_PASSWORD}@host.docker.internal:5432/wishly
      PREFECT_DATABASE_URL: postgresql://prefect:${PREFECT_DB_PASSWORD}@host.docker.internal:5432/prefect
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "3600"
      # Remote retention is count-based — last 48 dumps (DEPLOYMENT-PLAN T4).
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST:-48}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-wishly/postgres}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wishly_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do /scripts/backup.sh || echo "backup failed"; sleep "$${BACKUP_INTERVAL_SECONDS}"; done'
    restart: unless-stopped

volumes:
  wishly_backups:
    name: wishly_backups
