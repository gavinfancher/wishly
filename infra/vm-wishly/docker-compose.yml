# vm-wishly — the application tier (DEPLOYMENT-PLAN T1/T2/T3).
#
#   docker compose -f infra/vm-wishly/docker-compose.yml up -d --build
#
# Everything except the database. This VM holds **no durable state**: Prefect's
# server state lives in Postgres on vm-db, so the VM can be destroyed and rebuilt
# from this file plus Infisical at any time.
#
# Build context is the repo root (../..) so the images can copy backend/.
# No app port is published — inbound traffic arrives through the tunnel.
services:
  # One-shot schema migration. api/worker wait for it to finish, so they never
  # start against an un-migrated database.
  #
  # T3: `depends_on: postgres condition: service_healthy` cannot span hosts, so
  # the compose-level ordering guard is gone. This waits for the DB itself —
  # without it, a reboot of this VM while vm-db is still coming up runs Alembic
  # against an unreachable database and the stack comes up wrong.
  migrate:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.api
    image: wishly-api:latest
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python -c "
        import os, socket, time, urllib.parse as P
        u = P.urlparse(os.environ['DATABASE_URL'])
        for _ in range(60):
            try:
                socket.create_connection((u.hostname, u.port or 5432), timeout=2).close()
                break
            except OSError:
                time.sleep(2)
        else:
            raise SystemExit('database unreachable after 120s')
        print('database is accepting connections')
        "
        exec alembic upgrade head
    restart: "no"
    networks:
      - app_net

  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.api
    image: wishly-api:latest
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app_net
    # No ports published — cloudflared reaches api:8000 over app_net.

  # Prefect Server: scheduler + UI.
  #
  # T2: state lives in the `prefect` database on vm-db, not a local SQLite
  # volume. That is what makes this VM stateless, and it puts run history inside
  # the backup vm-db already takes. Prefect requires the asyncpg driver here.
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: wishly-prefect-server
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python -c "
        import os, socket, time, urllib.parse as P
        u = P.urlparse(os.environ['PREFECT_API_DATABASE_CONNECTION_URL'])
        for _ in range(60):
            try:
                socket.create_connection((u.hostname, u.port or 5432), timeout=2).close()
                break
            except OSError:
                time.sleep(2)
        else:
            raise SystemExit('database unreachable after 120s')
        "
        exec prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_HOME: /data
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
    ports:
      # UI bound to the VPN address only. The self-hosted OSS UI has no
      # authentication of its own, so it must never be published publicly.
      - "${PREFECT_UI_BIND_ADDRESS}:4200:4200"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:4200/api/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  # One-shot: publish the flow deployment + its hourly schedule to the server.
  prefect-deploy:
    # Built by prefect-worker below — declaring `build` on both services makes
    # buildx race on exporting the same tag and one of them fails.
    image: wishly-worker:latest
    pull_policy: never
    # Create the pool first: `prefect deploy` warns (and runs go unclaimed) if the
    # deployment references a pool that does not exist yet. Both are idempotent.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'prefect work-pool create "$${PREFECT_WORK_POOL}" --type process || true; prefect deploy --all'
    env_file:
      - .env
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL}
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: "no"
    networks:
      - app_net

  # Prefect worker: polls the server for scheduled runs and executes the flow in
  # *this* container. Flow code ships inside the image (prefect.yaml sets
  # `pull: null`), so a change under orchestration/ needs a rebuild here.
  prefect-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.worker
    image: wishly-worker:latest
    command:
      ["prefect", "worker", "start", "--pool", "${PREFECT_WORK_POOL}", "--type", "process"]
    env_file:
      - .env
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  cloudflared:
    image: cloudflare/cloudflared:2025.4.0
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
