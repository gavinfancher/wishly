# Hourly logical backup sidecar. Overlay on the main stack:
#
#   docker compose -f infra/compose.yaml -f infra/compose.backup.yaml \
#       --env-file infra/.env up -d backup
#
# Dumps the database and ships each dump to S3 (or any S3-compatible store, e.g.
# Cloudflare R2, via S3_ENDPOINT_URL). The local volume is only a staging area —
# the copy that matters is the remote one. For host-cron instead of an always-on
# container, see docs/runbooks/backup-restore.md.
#
# This is deliberately kept alongside RDS automated snapshots rather than replaced
# by them: a snapshot lives inside the same AWS account as the instance it protects
# and cannot be restored anywhere else, while a pg_dump in a bucket can be restored
# onto any Postgres — including a laptop. It is DSN-driven, so it runs unchanged
# against RDS or a local container.
services:
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: wishly-backup:latest
    container_name: wishly-backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "3600"
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-wishly/postgres}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - wishly_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do /scripts/backup.sh || echo "backup failed"; sleep "$${BACKUP_INTERVAL_SECONDS}"; done'
    networks:
      - app_net

volumes:
  wishly_backups:
    name: wishly_backups

networks:
  app_net:
    external: true
    name: infra_app_net
