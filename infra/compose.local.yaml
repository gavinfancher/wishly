# Local overlay: adds a Postgres container and publishes ports to loopback.
#
#   docker compose -f infra/compose.yaml -f infra/compose.local.yaml \
#     --env-file infra/.env up -d
#
# Both -f flags are required — this is an overlay, not a stack. In production the
# database is RDS and this file is not used, which is the only difference between
# the two environments.
services:
  # Stands in for RDS. The `schema` one-shot in the base file waits for it and
  # applies infra/sql/schema.sql, so a fresh volume comes up fully provisioned.
  #
  # NOTE: the test suite must NOT use this database. tests/conftest.py truncates
  # every table, and pointing it here once destroyed live development data. Tests
  # run against `wishly_test` and refuse to start against any database whose name
  # does not end in `_test`.
  postgres:
    image: postgres:18.4
    container_name: wishly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 keeps PGDATA in a versioned subdirectory; mounting the parent
      # is what the official image recommends so pg_upgrade --link stays possible.
      - wishly_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Published for inspection with psql/pgcli.
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks:
      - app_net

  # Published to loopback for curl during development. Production publishes
  # nothing: cloudflared reaches api:8000 over app_net either way.
  api:
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  wishly_pgdata:
    name: wishly_pgdata_local
