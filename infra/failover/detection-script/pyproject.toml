[project]
name = "detection-script"
version = "0.1.0"
description = "Tailscale device-staleness watchdog — the failover trigger."
readme = "README.md"
authors = [
    { name = "Gavin Fancher", email = "gavinfancher02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pendulum>=3.2.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
