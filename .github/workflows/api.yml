# Test the API, publish its image to GHCR, then deploy it to the VM.
#
#   ghcr.io/<owner>/wishly:<short sha>   permanent, one per commit
#   ghcr.io/<owner>/wishly:latest        moves to each new build on main
#
# test runs everywhere (GitHub-hosted). image and deploy run only for main.
name: api

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/compose.yaml", "infra/ansible/files/deploy.sh", ".github/workflows/api.yml"]
  pull_request:
    paths: ["backend/**", "infra/compose.yaml", "infra/ansible/files/deploy.sh", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for this run only: same image as local, no credentials.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishly_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.12.21/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  image:
    needs: test
    # Only main publishes. Pull requests and other branches just run the tests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/*
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64 # the VM and Fargate are x86_64
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wishly:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/wishly:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The self-hosted runner Ansible installed on the VM.
    runs-on: [self-hosted, wishly-vm]
    # One deploy at a time; a newer one waits rather than cancelling a half-done one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # Ship the compose file and deploy script from this commit, so changes to
      # them deploy like everything else instead of waiting for an Ansible run.
      - name: Update compose.yaml and deploy.sh on the VM
        run: install -m 0755 infra/ansible/files/deploy.sh /opt/wishly/deploy.sh && install -m 0644 infra/compose.yaml /opt/wishly/compose.yaml
      - name: Pull the new image and restart, with secrets from Infisical
        run: /opt/wishly/deploy.sh
