# Continuous integration (PLAN T8.1). Runs the same gates as the local
# Definition of Done: backend ruff/format/mypy/pytest (against a real Postgres
# service) and frontend lint/typecheck/build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wishly
          POSTGRES_PASSWORD: wishly
          POSTGRES_DB: wishly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishly -d wishly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wishly:wishly@localhost:5432/wishly
      # Settings requires these at import time; CI values are dummies (no network).
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci
      RESEND_API_KEY: re_ci
      RESEND_WEBHOOK_SIGNING_SECRET: whsec_ci
      EMAIL_FROM: reminders@wishly.dev
      APP_BASE_URL: https://wishly.dev
      ALLOWED_ORIGINS: https://wishly.dev
      ENVIRONMENT: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
