# Build the wishly image and publish it to GHCR, tagged with the commit.
#
# Runs on a GitHub-hosted runner. The repository is public, so those minutes are
# free, and a self-hosted runner on a public repo would run fork code on the home
# network (see infra/runner.md). Nothing here holds a long-lived credential: the
# push uses the job's GITHUB_TOKEN, which expires when the job ends.
#
# First publish creates ghcr.io/gavinfancher/wishly as PRIVATE. Flip it to public
# once in the package settings so the cluster can pull without a secret.
name: build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/Dockerfile.api"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to write the same tag.
# Not cancel-in-progress: a half-pushed image is worse than a slow queue.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to ghcr.io/<owner>/*

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wishly

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag
        id: tag
        # The tag is the commit so "which source is this?" needs nobody's memory.
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.api
          # amd64 only: the VM and the cluster nodes are x86_64.
          platforms: linux/amd64
          # A single-platform manifest rather than a list; see infra/images.sh.
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache in the Actions cache, so an unchanged lockfile skips uv sync.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### \`${{ steps.tag.outputs.tag }}\`"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
            echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
