# The Wishly API: one container, the whole app. It serves the frontend's
# /v1 API and sends the 9am Eastern emails from its own scheduler thread.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishly-api
  annotations:
    secrets.infisical.com/auto-reload: "true" # restart when the `wishly` Secret changes
spec:
  # One per worker node. Each replica runs its own scheduler thread too; that's
  # safe, because a send first claims its row in the `sends` table and only
  # one claim can win, so a reminder never goes out twice.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # the new pod is ready before the old one stops
      maxSurge: 1
  selector:
    matchLabels:
      app: wishly-api
  template:
    metadata:
      labels:
        app: wishly-api
    spec:
      automountServiceAccountToken: false # it never talks to the Kubernetes API
      # One pod per worker. If a worker dies or is drained, its pod comes back on
      # a healthy worker (two there for a while), so there are always 3.
      #   nodeTaintsPolicy: Honor  — skip nodes this pod can't schedule on (down,
      #     cordoned, the control plane); the default would count a dead node as
      #     an empty spot and leave the replacement Pending.
      #   matchLabelKeys           — spread each rollout's new pods among
      #     themselves, so a deploy always ends 1/1/1.
      # It doesn't rebalance: after a dead worker returns, the next deploy evens
      # things out again.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: wishly-api
          matchLabelKeys: [pod-template-hash]
      # Replace pods on an unreachable node after 60s instead of the default 5 min.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the `wishly` user in backend/Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/gavinfancher/wishly # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          # Names only; each value comes from the `wishly` Secret, which the
          # Infisical operator builds (infisical-secret.yaml). Listed one by
          # one, so the API never sees TUNNEL_TOKEN.
          env:
            - name: WISHLY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: wishly, key: WISHLY_DATABASE_URL } }
            - name: WISHLY_RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: wishly, key: WISHLY_RESEND_API_KEY } }
            - name: WISHLY_CORS_ORIGINS
              valueFrom: { secretKeyRef: { name: wishly, key: WISHLY_CORS_ORIGINS } }
            - name: WISHLY_SIGNUP_ENABLED
              valueFrom:
                secretKeyRef: { name: wishly, key: WISHLY_SIGNUP_ENABLED, optional: true }
          # Liveness never touches the database: a database outage shouldn't
          # make Kubernetes restart a process that's fine.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          # Readiness does: no database, no traffic.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: wishly-api
spec:
  selector:
    app: wishly-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Draining a node evicts at most one API pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wishly-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: wishly-api
