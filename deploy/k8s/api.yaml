# The Wishly API: one container, the whole app. It serves the frontend's
# /v1 API and sends the 9am Eastern emails from its own scheduler thread.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishly-api
  annotations:
    secrets.infisical.com/auto-reload: "true" # restart when the `wishly` Secret changes
spec:
  # One replica: it's the scheduler too. During a rollout the old and new pods
  # overlap for a moment, which is safe — the `sends` table stops a reminder
  # going out twice.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # the new pod is ready before the old one stops
      maxSurge: 1
  selector:
    matchLabels:
      app: wishly-api
  template:
    metadata:
      labels:
        app: wishly-api
    spec:
      automountServiceAccountToken: false # it never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the `wishly` user in backend/Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/gavinfancher/wishly # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          # Names only; each value comes from the `wishly` Secret, which the
          # Infisical operator builds (infisical-secret.yaml). Listed one by
          # one, so the API never sees TUNNEL_TOKEN.
          env:
            - name: WISHLY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: wishly, key: WISHLY_DATABASE_URL } }
            - name: WISHLY_RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: wishly, key: WISHLY_RESEND_API_KEY } }
            - name: WISHLY_CORS_ORIGINS
              valueFrom: { secretKeyRef: { name: wishly, key: WISHLY_CORS_ORIGINS } }
            - name: WISHLY_SIGNUP_ENABLED
              valueFrom:
                secretKeyRef: { name: wishly, key: WISHLY_SIGNUP_ENABLED, optional: true }
          # Liveness never touches the database: a database outage shouldn't
          # make Kubernetes restart a process that's fine.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          # Readiness does: no database, no traffic.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: wishly-api
spec:
  selector:
    app: wishly-api
  ports:
    - name: http
      port: 8000
      targetPort: http
