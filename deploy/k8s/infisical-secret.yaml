# The `wishly` Secret every pod reads, kept in sync with Infisical by the
# Infisical operator (installed by the homek8s repo). This file holds no
# values: they live in Infisical, project wishly-tg-hh, env prod, at the root.
# Edit one there and within a minute the operator updates the Secret
# and restarts the Deployments marked secrets.infisical.com/auto-reload.
#
# Keys: WISHLY_DATABASE_URL, WISHLY_RESEND_API_KEY, WISHLY_CORS_ORIGINS,
# TUNNEL_TOKEN, and optionally WISHLY_SIGNUP_ENABLED.
#
#   kubectl -n wishly describe infisicalsecret wishly   # did it sync?
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: wishly
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60 # seconds between checks for changed values
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: wishly-tg-hh
        envSlug: prod
        secretsPath: / # the whole project is Wishly's
      # Logs in as the `k8s-cluster` machine identity, which only this project
      # knows about (Viewer). Its client id/secret are made by hand, never in git:
      #   kubectl -n infisical-operator-system create secret generic infisical-wishly-identity \
      #     --from-literal=clientId=... --from-literal=clientSecret=...
      credentialsRef:
        secretName: infisical-wishly-identity
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: wishly
      secretNamespace: wishly
      creationPolicy: Owner # the operator owns the Secret; never create it by hand
