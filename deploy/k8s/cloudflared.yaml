# The Cloudflare Tunnel connector. It dials out to Cloudflare, so the cluster
# needs no open ports or public IP. Its route (api.<domain> →
# http://wishly-api.wishly.svc.cluster.local:8000) lives in Cloudflare,
# set by infra/terraform/tunnel.tf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  annotations:
    secrets.infisical.com/auto-reload: "true" # restart when the `wishly` Secret changes
spec:
  # One connector per worker node: any of them can restart or move while the
  # others carry traffic.
  replicas: 3
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      # One pod per worker. If a worker dies or is drained, its pod comes back on
      # a healthy worker (two there for a while), so there are always 3.
      #   nodeTaintsPolicy: Honor  — skip nodes this pod can't schedule on (down,
      #     cordoned, the control plane); the default would count a dead node as
      #     an empty spot and leave the replacement Pending.
      #   matchLabelKeys           — spread each rollout's new pods among
      #     themselves, so a deploy always ends 1/1/1.
      # It doesn't rebalance: after a dead worker returns, the next deploy evens
      # things out again.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: cloudflared
          matchLabelKeys: [pod-template-hash]
      # Replace pods on an unreachable node after 60s instead of the default 5 min.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the image's `nonroot` user
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Pinned: bump on purpose. `latest` would change under us on any restart.
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000 # serves /ready for the probes below
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: wishly, key: TUNNEL_TOKEN } }
          ports:
            - name: metrics
              containerPort: 2000
          # /ready is 200 once this connector has a live connection to Cloudflare.
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# Drains and cluster upgrades take down at most one connector at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cloudflared
