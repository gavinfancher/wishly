# Only cloudflared may open connections to the API. Everything users and the
# watchdog send arrives through the tunnel, so nothing else in the cluster has
# a reason to reach it. (Kubelet health probes come from the node and are
# allowed by most CNIs regardless; check yours if the probes start failing.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wishly-api-ingress
spec:
  podSelector:
    matchLabels:
      app: wishly-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8000
