# Everything Wishly runs in the cluster. Argo CD (deploy/argocd/wishly.yaml)
# watches this directory on main and applies it.
#
# Except the secrets: the `wishly` Secret every pod reads is created by hand
# with deploy/create-secret.sh and never committed. Argo leaves it alone, since
# it only prunes what it created.
#
#   kubectl kustomize deploy/k8s     # see exactly what Argo will apply
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wishly

resources:
  - namespace.yaml
  - api.yaml
  - cloudflared.yaml
  - networkpolicy.yaml

# The one line CI changes. After every image build on main, the `release` job
# in .github/workflows/api.yml rewrites newTag to the new commit's short SHA
# and pushes; Argo sees the commit and rolls the Deployment.
images:
  - name: ghcr.io/gavinfancher/wishly
    newTag: 7f5001d
