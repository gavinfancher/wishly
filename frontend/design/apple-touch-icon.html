<!-- Source for public/apple-touch-icon.png. Regenerate with:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=180,180 --virtual-time-budget=5000 \
    --screenshot=public/apple-touch-icon.png design/apple-touch-icon.html

Chrome rather than a local rasteriser because the mark uses Schibsted
Grotesk from Google Fonts, which is not installed on the machine. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&display=block" rel="stylesheet">
<style>html,body{margin:0;padding:0;width:180px;height:180px;overflow:hidden}svg{display:block}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 64 64">
  <!-- Full bleed: iOS masks its own rounded corners, so the tile has no radius
       and no inset of its own. -->
  <rect x="0" y="0" width="64" height="64" fill="#fafaf8"/>
  <!-- The mark's own bbox centre is (33.5, 31.5), not (32, 32). Recentre it,
       then scale to ~84% so it is not crowding the mask edge. -->
  <g transform="translate(32,32) scale(0.84) translate(-33.5,-31.5)">
    <text x="32" y="43" text-anchor="middle" fill="#1b1b1f"
          font-family="'Schibsted Grotesk'" font-weight="800" font-size="30">4</text>
    <path d="M46 17 C 30 11, 12 18, 11 31 C 10 44, 26 52, 39 49 C 53 46, 57 35, 53 26 C 49 17, 37 14, 29 16"
          fill="none" stroke="#c93b2b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
</body></html>
