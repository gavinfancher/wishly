<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores rel="icon" for Add to Home Screen and cannot use SVG at
         all, so the home-screen icon is a separate 180x180 PNG. Without it iOS
         saves a screenshot of the page as the icon. Source: design/apple-touch-icon.html -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Otherwise the home-screen label is the <title>, truncated to "Wishly —...". -->
    <meta name="apple-mobile-web-app-title" content="Wishly" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wishly emails you before the birthdays and anniversaries you track, so you have time to prepare."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#c0c0c0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2b2e" />
    <title>Wishly — never miss a date</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
