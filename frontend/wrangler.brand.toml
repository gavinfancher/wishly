# wishly-brand: public static assets, deliberately OUTSIDE Cloudflare Access.
#
# Exists for one reason: the Access login page renders login_design.logo_path
# via <img> in a browser that has not authenticated yet. wishly.dev is covered
# by the "Wishly (testing)" Access app in full (apex hostname, empty path), so a
# logo served from the SPA would 302 to the login page and render broken there.
#
# The Access app matches the apex hostname only, so brand.wishly.dev sits
# outside it by construction — no Bypass policy to misconfigure. Keep it that
# way: ONLY unauthenticated-safe brand assets belong in ./public/brand.
name = "wishly-brand"
account_id = "2750df8a500fb8335c195bad8cccc14a"
compatibility_date = "2026-06-13"

# Nothing may serve this Worker on workers.dev: brand.wishly.dev is the only
# intended hostname. NOTE: both of these must stay ABOVE [assets] — TOML folds
# any key after a table header into that table, and wrangler then silently
# ignores them (it warns, but still deploys).
workers_dev = false

routes = [
  { pattern = "brand.wishly.dev", custom_domain = true },
]

# Not a build artefact — served straight from source, so the logo cannot drift
# from what the repo says it is. No worker.js: static assets only.
[assets]
directory = "./public/brand"
