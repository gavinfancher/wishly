<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wishly mark: a day number circled in red pen on a calendar tile. -->
  <style>
    .tile { fill: #fafaf8; }
    .edge { stroke: #e8e7e2; }
    .day  { fill: #1b1b1f; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1d1d22; }
      .edge { stroke: #33333b; }
      .day  { fill: #ececee; }
    }
  </style>
  <rect class="tile edge" x="1.5" y="1.5" width="61" height="61" rx="15" stroke-width="1" />
  <text
    class="day"
    x="32"
    y="43"
    text-anchor="middle"
    font-family="'Schibsted Grotesk', system-ui, sans-serif"
    font-weight="800"
    font-size="30"
  >
    4
  </text>
  <path
    d="M46 17 C 30 11, 12 18, 11 31 C 10 44, 26 52, 39 49 C 53 46, 57 35, 53 26 C 49 17, 37 14, 29 16"
    fill="none"
    stroke="#c93b2b"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
